name: Release artifacts

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Build, attest, and publish
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: release
    permissions:
      actions: read
      attestations: write
      artifact-metadata: write
      contents: write
      id-token: write
    steps:
      - name: Check out full history
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version: '1.25.x'
          cache: true
      - name: Verify modules
        run: go mod verify
      - name: Verify formatting
        shell: bash
        run: test -z "$(gofmt -l .)"
      - name: Lint
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9
        with:
          version-file: .golangci-lint-version
      - name: Validate source
        run: |
          go test ./...
          go test -race ./...
          go vet ./...
          ./scripts/performance-check.sh
          ./scripts/security-check.sh
      - name: Install Gitleaks
        shell: bash
        run: |
          GOBIN="$RUNNER_TEMP/bin" go install github.com/zricethezav/gitleaks/v8@v8.30.1
          echo "$RUNNER_TEMP/bin" >>"$GITHUB_PATH"
      - name: Scan full Git history
        run: ./scripts/secret-scan.sh --history
      - name: Build archives
        env:
          COMMIT: ${{ github.sha }}
          OUT_DIR: dist
          VERSION: ${{ github.ref_name }}
        run: ./scripts/release.sh
      - name: Generate SPDX SBOM
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0
        with:
          path: dist
          format: spdx-json
          output-file: dist/gitwatch_${{ github.ref_name }}_sbom.spdx.json
          upload-artifact: false
          upload-release-assets: false
      - name: Add SBOM checksum
        shell: bash
        run: cd dist && shasum -a 256 ./*_sbom.spdx.json >>SHA256SUMS
      - name: Verify release artifacts
        env:
          VERSION: ${{ github.ref_name }}
        run: ./scripts/verify-release-artifacts.sh dist
      - name: Attest artifacts and SBOM
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4
        with:
          subject-checksums: dist/SHA256SUMS
          sbom-path: dist/gitwatch_${{ github.ref_name }}_sbom.spdx.json
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          gh release create "$GITHUB_REF_NAME" \
            dist/*.tar.gz \
            dist/*.zip \
            dist/*_sbom.spdx.json \
            dist/SHA256SUMS \
            --generate-notes \
            --title "gitwatch ${GITHUB_REF_NAME}" \
            --verify-tag
