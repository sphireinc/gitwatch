name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25.x'
          cache: true
      - run: go test ./...
      - run: go vet ./...
      - run: go build ./cmd/gitwatch
      - if: runner.os != 'Windows'
        run: go test -race ./...
      - if: runner.os == 'Linux'
        run: golangci-lint run
