name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Quality and policy
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: .go-version
          cache: true
      - name: Verify module files
        shell: bash
        run: |
          go mod tidy
          git diff --exit-code -- go.mod go.sum
          go mod verify
      - name: Verify formatting
        shell: bash
        run: test -z "$(gofmt -l .)"
      - name: Verify patch whitespace
        run: git diff --check
      - name: Lint
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9
        with:
          version-file: .golangci-lint-version
      - name: Vet
        run: go vet ./...
      - name: Security invariants
        run: ./scripts/security-check.sh
      - name: Performance budgets
        run: ./scripts/performance-check.sh

  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15, windows-2025]
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: .go-version
          cache: true
      - name: Test
        run: go test ./...
      - name: Race test
        if: runner.os != 'Windows'
        run: go test -race ./...
      - name: Build
        run: go build ./cmd/gitwatch
      - name: Runtime smoke on Unix
        if: runner.os != 'Windows'
        shell: bash
        run: |
          set -eu
          binary="$RUNNER_TEMP/gitwatch"
          go build -o "$binary" ./cmd/gitwatch
          test -n "$("$binary" --version)"
          test -n "$("$binary" --help 2>&1)"
          "$binary" --config-check
          demo="$RUNNER_TEMP/gitwatch-smoke"
          ./scripts/demo-repo.sh "$demo" >/dev/null
          git -C "$demo" status --porcelain=v2 --branch >"$RUNNER_TEMP/status"
          test -s "$RUNNER_TEMP/status"
      - name: Runtime smoke on Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $binary = Join-Path $env:RUNNER_TEMP 'gitwatch.exe'
          go build -o $binary ./cmd/gitwatch
          if (-not (& $binary --version)) { throw 'version output was empty' }
          if (-not (& $binary --help 2>&1)) { throw 'help output was empty' }
          & $binary --config-check
          $demo = Join-Path $env:RUNNER_TEMP 'gitwatch-smoke'
          New-Item -ItemType Directory -Force $demo | Out-Null
          git -C $demo init --quiet
          git -C $demo config user.name gitwatch-ci
          git -C $demo config user.email gitwatch-ci@example.com
          'initial' | Set-Content (Join-Path $demo 'tracked.txt')
          git -C $demo add --all --
          git -C $demo commit --quiet -m initial
          'changed' | Set-Content (Join-Path $demo 'tracked.txt')
          $status = git -C $demo status --porcelain=v2 --branch
          if (-not $status) { throw 'status output was empty' }

  secrets:
    name: Full-history secret scan
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out full history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: .go-version
          cache: true
      - name: Install Gitleaks
        shell: bash
        run: |
          GOBIN="$RUNNER_TEMP/bin" go install github.com/zricethezav/gitleaks/v8@v8.30.1
          echo "$RUNNER_TEMP/bin" >>"$GITHUB_PATH"
      - name: Scan full Git history
        run: ./scripts/secret-scan.sh --history
