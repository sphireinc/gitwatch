<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="650" viewBox="0 0 1120 650" role="img" aria-labelledby="title description">
  <title id="title">gitwatch status dashboard and selected-file diff</title>
  <desc id="description">A rendered snapshot from the recorded deterministic gitwatch demo session.</desc>
  <rect width="1120" height="650" rx="18" fill="#10141c"/>
  <rect x="1" y="1" width="1118" height="648" rx="17" fill="none" stroke="#30394a" stroke-width="2"/>
  <circle cx="30" cy="28" r="7" fill="#ff6b6b"/>
  <circle cx="54" cy="28" r="7" fill="#ffd166"/>
  <circle cx="78" cy="28" r="7" fill="#66d9a8"/>
  <g font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="20">
    <text x="28" y="72" fill="#f5f7fa" font-weight="700">gitwatch · main · ready</text>
    <text x="28" y="108" fill="#9ee493">STAGED 0</text>
    <text x="160" y="108" fill="#ffd166">MODIFIED 2</text>
    <text x="330" y="108" fill="#72b7ff">UNTRACKED 1</text>
    <text x="520" y="108" fill="#aab4c8">CONFLICTS 0</text>
    <line x1="28" y1="130" x2="1092" y2="130" stroke="#475269" stroke-width="2"/>

    <rect x="20" y="145" width="460" height="38" rx="7" fill="#243049"/>
    <text x="34" y="171" fill="#f5f7fa">›</text>
    <text x="64" y="171" fill="#ffd166">M</text>
    <text x="94" y="171" fill="#f5f7fa">docs/notes.md</text>
    <text x="64" y="211" fill="#ffd166">M</text>
    <text x="94" y="211" fill="#d7dce5">internal/app/demo.go</text>
    <text x="64" y="251" fill="#72b7ff">?</text>
    <text x="94" y="251" fill="#d7dce5">untracked-notes.txt</text>

    <line x1="500" y1="145" x2="500" y2="548" stroke="#475269" stroke-width="2"/>
    <text x="528" y="171" fill="#f5f7fa" font-weight="700">Selected diff: docs/notes.md</text>
    <text x="528" y="211" fill="#aab4c8">diff --git a/docs/notes.md b/docs/notes.md</text>
    <text x="528" y="247" fill="#aab4c8">index 4db77a3..cb8a156 100644</text>
    <text x="528" y="283" fill="#ff9b9b">--- a/docs/notes.md</text>
    <text x="528" y="319" fill="#9ee493">+++ b/docs/notes.md</text>
    <text x="528" y="355" fill="#b39ddb">@@ -1,3 +1,4 @@</text>
    <text x="528" y="391" fill="#d7dce5"> # Demo notes</text>
    <text x="528" y="427" fill="#d7dce5"> This file is intentionally modified for the</text>
    <text x="528" y="459" fill="#d7dce5"> gitwatch recording.</text>
    <rect x="520" y="478" width="566" height="38" rx="6" fill="#173b2d"/>
    <text x="528" y="504" fill="#9ee493">+A second line demonstrates a larger diff.</text>

    <line x1="28" y1="548" x2="1092" y2="548" stroke="#475269" stroke-width="2"/>
    <text x="28" y="592" fill="#72b7ff">[j/k]</text>
    <text x="94" y="592" fill="#aab4c8">move</text>
    <text x="170" y="592" fill="#72b7ff">[space]</text>
    <text x="258" y="592" fill="#aab4c8">stage/unstage</text>
    <text x="440" y="592" fill="#72b7ff">[enter/d]</text>
    <text x="550" y="592" fill="#aab4c8">diff</text>
    <text x="620" y="592" fill="#72b7ff">[r]</text>
    <text x="666" y="592" fill="#aab4c8">refresh</text>
    <text x="772" y="592" fill="#72b7ff">[?]</text>
    <text x="818" y="592" fill="#aab4c8">help</text>
    <text x="890" y="592" fill="#72b7ff">[q]</text>
    <text x="936" y="592" fill="#aab4c8">quit</text>
  </g>
</svg>
